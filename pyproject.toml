[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phantom-redteam"
version = "0.2.0"
description = "Test AI agents for prompt injection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer",
    "httpx",
    "pydantic>=2",
    "pyyaml",
    "rich",
    "jinja2",
]

[project.optional-dependencies]
ai = ["anthropic"]
examples = ["fastapi", "uvicorn", "anthropic"]
dev = ["pytest", "build"]

[project.scripts]
phantom = "phantom_redteam.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/phantom_redteam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples"]
